<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CCSA Play Time Tracker</title><meta name='theme-color' content='#087f6b'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><link rel='manifest' href='manifest.webmanifest'><link rel='apple-touch-icon' href='icon-192.png'><style>body{font:16px system-ui;margin:0;background:#f3f6f9;color:#15202b}main{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:9px;border:1px solid #ccd3db;border-radius:8px}button{background:#087f6b;color:#fff;border:0}.secondary{background:#475467}.game{border-left:6px solid #087f6b}.player{display:grid;grid-template-columns:65px 1fr auto auto;gap:8px;align-items:center;margin:8px 0}.bar{height:7px;background:#e6e9ee;border-radius:5px}.bar i{display:block;height:100%;background:#12b76a}.warn{color:#b54708;font-weight:700}.ok{color:#027a48;font-weight:700}small{color:#667085}</style></head><body><main><h1>CCSA Multi-Game Play Time Tracker</h1><div class='card row'><input id='userName' placeholder='Tracker name'><input id='userPin' type='password' inputmode='numeric' placeholder='PIN'><button onclick='login()'>Sign in</button><button class='secondary' onclick='logout()'>Sign out</button><strong id='who'></strong></div><div class='card row'><input id='team' placeholder='Team tracked'><select id='division'><option>U7</option><option>U8-U9</option><option>U10-U11</option><option>U12</option><option>U14</option></select><button onclick='addGame()'>+ Add game</button></div><div id='games'></div></main><script>
let games=JSON.parse(localStorage.getItem('ccsaMulti')||'[]'),last=Date.now(),currentUser=localStorage.getItem('ccsaUser')||'';
function login(){let u=userName.value.trim(),p=userPin.value.trim();if(!u||!p)return alert('Enter tracker name and PIN.');let users=JSON.parse(localStorage.getItem('ccsaUsers')||'{}');if(users[u]&&users[u]!==p)return alert('Incorrect PIN.');if(!users[u]){users[u]=p;localStorage.setItem('ccsaUsers',JSON.stringify(users));}currentUser=u;localStorage.setItem('ccsaUser',u);render()} function logout(){currentUser='';localStorage.removeItem('ccsaUser');render()}
function cfg(d){return d==='U7'?[4,600,2]:d==='U8-U9'?[4,720,2]:d==='U10-U11'?[4,900,2]:d==='U12'?[2,1800,3]:[2,2100,3]}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function save(){localStorage.setItem('ccsaMulti',JSON.stringify(games))}
function addGame(){if(!currentUser)return alert('Sign in first.');if(!team.value.trim())return;games.push({id:Date.now(),owner:currentUser,team:team.value.trim(),division:division.value,elapsed:0,period:1,running:false,players:[]});team.value='';save();render()}
function addPlayer(gid){let g=games.find(x=>x.id===gid),el=document.getElementById('p'+gid),n=el.value.trim();if(!n)return;g.players.push({n,time:0,on:false,late:g.elapsed,subs:Array(4).fill(0)});el.value='';save();render()}
function toggleGame(id){let g=games.find(x=>x.id===id);g.running=!g.running;save();render()}
function nextPeriod(id){let g=games.find(x=>x.id===id),c=cfg(g.division);g.running=false;if(g.period<c[0])g.period++;save();render()}
function togglePlayer(gid,i){let g=games.find(x=>x.id===gid),p=g.players[i],c=cfg(g.division);p.on=!p.on;if(p.on)p.subs[g.period-1]=(p.subs[g.period-1]||0)+1;save();render()}
function removeGame(id){games=games.filter(x=>x.id!==id);save();render()}
function reportRows(g){let c=cfg(g.division),total=c[0]*c[1];return g.players.map(p=>{let req=Math.max(0,(total-p.late)/2);return {player:p.n,played:fmt(p.time),required:fmt(req),status:p.time>=req?'MET':'NOT MET',lateAt:fmt(p.late),entries:p.subs.slice(0,c[0]).join('/')};});}
function safeName(s){return (s||'game').replace(/[^a-z0-9_-]+/gi,'_');}
function exportCSV(id){let g=games.find(x=>x.id===id),rows=reportRows(g),q=v=>'"'+String(v).replace(/"/g,'""')+'"';let csv=['Team,Division,Game Time,Period',''+q(g.team)+','+q(g.division)+','+q(fmt(g.elapsed))+','+g.period,'','Player,Played,Required 50%,Status,Late Arrival At,Period Entries',...rows.map(r=>[r.player,r.played,r.required,r.status,r.lateAt,r.entries].map(q).join(','))].join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),safeName(g.team)+'_game_report.csv');}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportPDF(id){let g=games.find(x=>x.id===id),rows=reportRows(g),w=window.open('','_blank');let esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));w.document.write(`<!doctype html><title>Game Report</title><style>body{font:14px Arial;padding:28px;color:#172033}h1{color:#075b4c}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #bbb;padding:8px;text-align:left}th{background:#eaf4f1}@media print{button{display:none}}</style><h1>CCSA Field Marshal Game Report</h1><p><b>Team:</b> ${esc(g.team)} &nbsp; <b>Division:</b> ${esc(g.division)} &nbsp; <b>Game time:</b> ${fmt(g.elapsed)} &nbsp; <b>Period:</b> ${g.period}</p><table><thead><tr><th>Player</th><th>Played</th><th>Required 50%</th><th>Status</th><th>Late arrival</th><th>Period entries</th></tr></thead><tbody>${rows.map(r=>`<tr><td>#${esc(r.player)}</td><td>${r.played}</td><td>${r.required}</td><td>${r.status}</td><td>${r.lateAt}</td><td>${r.entries}</td></tr>`).join('')}</tbody></table><p>Field Marshal Signature: __________________________</p><p>Head Coach Signature: __________________________</p><button onclick='window.print()'>Save / Print PDF</button>`);w.document.close();}

function render(){let root=document.getElementById('games');root.innerHTML='';document.getElementById('who').textContent=currentUser?'Signed in: '+currentUser:'Not signed in';games.filter(g=>currentUser && g.owner===currentUser).forEach(g=>{let c=cfg(g.division),total=c[0]*c[1],met=g.players.filter(p=>p.time>=Math.max(0,(total-p.late)/2)).length;let d=document.createElement('div');d.className='card game';d.innerHTML=`<h2>${g.team} <small>${g.division}</small></h2><div class='row'><strong id='clock${g.id}'>${fmt(g.elapsed)}</strong><span>Period ${g.period}/${c[0]}</span><button onclick='toggleGame(${g.id})'>${g.running?'Pause':'Start'}</button><button class='secondary' onclick='nextPeriod(${g.id})'>Next period</button><button class='secondary' onclick='exportCSV(${g.id})'>CSV report</button><button class='secondary' onclick='exportPDF(${g.id})'>PDF report</button><button class='secondary' onclick='removeGame(${g.id})'>Close game</button></div><p><small>${met}/${g.players.length} players currently meet target</small></p><div class='row'><input id='p${g.id}' type='number' inputmode='numeric' min='0' step='1' placeholder='Player #'><button onclick='addPlayer(${g.id})'>Add player</button></div>`;g.players.forEach((p,i)=>{let req=Math.max(0,(total-p.late)/2),pct=req?Math.min(100,p.time/req*100):100,subs=p.subs[g.period-1]||0;d.innerHTML+=`<div class='player'><b>#${p.n}</b><div><div class='bar'><i style='width:${pct}%'></i></div><small>${fmt(p.time)} / ${fmt(req)} target · entries ${subs}/${c[2]}</small></div><button onclick='togglePlayer(${g.id},${i})'>${p.on?'OUT':'IN'}</button><span class='${subs>c[2]||p.time<req?'warn':'ok'}'>${subs>c[2]?'SUB LIMIT':p.time>=req?'Met':'Tracking'}</span></div>`});root.appendChild(d)});}
setInterval(()=>{let now=Date.now(),dt=(now-last)/1000;last=now,changed=false;games.forEach(g=>{if(g.running){g.elapsed+=dt;g.players.forEach(p=>{if(p.on)p.time+=dt});let e=document.getElementById('clock'+g.id);if(e)e.textContent=fmt(g.elapsed);changed=true;}});if(changed)save();},500);render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}
</script></body></html>
